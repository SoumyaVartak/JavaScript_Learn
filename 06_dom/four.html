<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai aur code dom</title>
</head>
<body style="background-color: black; color:white">
    <ul class="language">
        <li>jaavascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
     const li=       document.createElement('li')
     li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)

    }
    addLanguage("python")
    addLanguage("typpescriipt")
// below  approach is optimised
    function addOptiLanguage(langNames){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langNames))
        document.querySelector('.language').appendChild(li)

    }
    addOptiLanguage('java')


    // edit
    const secondLan = document.querySelector("li:nth-child(2)")
    //secondLan.innerHTML="core py"

    // second approach
    const newLi = document.createElement('li')
    newLi.textContent = "core py"
    secondLan.replaceWith(newLi)

    //edit
    const firstLan = document.querySelector("li:first-child")
    firstLan.outerHTML = '<li>js</js>'

    // remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()
</script>
</html>
